name: Build APK

# يشتغل تلقائي مع أي push على main، وكمان ينفع تشغله يدوي من تبويب Actions
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # أندرويد SDK بالفعل مثبت مسبقًا على ubuntu-latest، فبس بنوافق على التراخيص
      # وننزل الحزم المطلوبة بالتحديد بدل الاعتماد على action خارجي غير مستقر
      - name: Accept Android SDK licenses & install required packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
