name: Build APK

# يشتغل تلقائي مع أي push على main، وكمان ينفع تشغله يدوي من تبويب Actions
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # نحدد مكان sdkmanager بالظبط ونضيفه لـ PATH، لأنه مش متاح مباشرة
      # على كل صور ubuntu-latest بنفس الشكل
      - name: Locate Android SDK tools
        run: |
          echo "ANDROID_HOME is: $ANDROID_HOME"
          find "$ANDROID_HOME" -iname "sdkmanager" 2>/dev/null
          SDKMANAGER_DIR=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -iname "bin" | head -n 1)
          echo "SDKMANAGER_DIR=$SDKMANAGER_DIR" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses & install required packages
        run: |
          export PATH="$SDKMANAGER_DIR:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # بنثبت إصدار Gradle متوافق مع Android Gradle Plugin 8.1.2
      # (أحدث إصدار Gradle بيبقى غير متوافق ويسبب فشل زي ده)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
