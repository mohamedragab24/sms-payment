plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

// رقم الإصدار يأتي من GitHub Actions (رقم التشغيل) ليعرف التطبيق أن هناك تحديثًا
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toInteger()

android {
    namespace 'com.example.smstotelegram'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.smstotelegram"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName "1.0.${appVersionCode}"
    }

    // توقيع ثابت: لازم يكون نفس المفتاح في كل إصدار حتى يقبل أندرويد التحديث فوق النسخة المثبتة
    signingConfigs {
        release {
            storeFile file('release.p12')
            storeType 'pkcs12'
            storePassword 'qHZozc2Tt8JwH7WLdNWW'
            keyAlias 'sms'
            keyPassword 'qHZozc2Tt8JwH7WLdNWW'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // لا نوقف بناء النسخة بسبب تحذيرات فحص الكود
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // تخزين الرسائل محليًا
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // لتخزين قائمة مزودي الخدمة كـ JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // لإرسال طلبات HTTP بسيطة لتليجرام
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
